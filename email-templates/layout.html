<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>{{subject}}</title>
  </head>
  <!--
    Shell condiviso da tutti i template (vedi lib/services/emailTemplates.ts):
    ogni template fornisce solo {{content}}, questo file mette intorno header,
    footer e stili. Tutto lo stile è inline/in un <style> nel <head> e la
    struttura è a tabelle perché diversi client email (Outlook desktop in
    testa) ignorano flexbox/grid e i CSS esterni.
  -->
  <body style="margin:0; padding:0; background-color:#EEF0F2;">
    <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="background-color:#EEF0F2; padding:32px 16px;">
      <tr>
        <td align="center">
          <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="max-width:560px; background-color:#ffffff; border:1px solid #e4e4e7; border-radius:12px; overflow:hidden;">
            <!-- Header -->
            <tr>
              <td style="padding:28px 32px 20px 32px; border-bottom:1px solid #e4e4e7;">
                <span style="font-family:Helvetica,Arial,sans-serif; font-size:20px; font-weight:700; letter-spacing:-0.5px; color:#13100F;">TYPAMINE</span>
                <span style="display:inline-block; width:10px; height:10px; background-color:#ff3131; border-radius:2px; margin-left:6px;"></span>
              </td>
            </tr>

            <!-- Content -->
            <tr>
              <td style="padding:32px; font-family:Helvetica,Arial,sans-serif; font-size:15px; line-height:1.6; color:#3f3f46;">
                {{{content}}}
              </td>
            </tr>

            <!-- Footer -->
            <tr>
              <td style="padding:20px 32px 28px 32px; border-top:1px solid #e4e4e7; font-family:Helvetica,Arial,sans-serif; font-size:11px; line-height:1.6; color:#a1a1aa;">
                &copy; {{year}} Typamine Studio — All rights reserved.<br />
                This is an automated message, please do not reply directly to it.
              </td>
            </tr>
          </table>
        </td>
      </tr>
    </table>
  </body>
</html>
